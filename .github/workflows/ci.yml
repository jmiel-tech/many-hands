name: CI

# Checks every pull request before it can be merged into main.
# The "Protect Main" ruleset requires the "Build and test" check below to pass,
# so a PR that doesn't build (for example, one missing files) can't be merged.
# This workflow never deploys anything.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator used by the rules tests needs Java 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # Same build the GitHub Pages deploy runs.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_ENABLE_ASSISTANT: ${{ vars.VITE_ENABLE_ASSISTANT || 'true' }}
          VITE_CHAT_ENDPOINT: https://many-hands-chat.jmielk92.workers.dev
      # Catch broken Firestore rules before they reach main and fail the rules deploy.
      - run: npm run test:rules
