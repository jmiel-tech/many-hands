name: Deploy Firestore rules

# firestore.rules in this repo is the source of truth. Don't edit rules in the
# Firebase console: the next deploy from here overwrites them.

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tests/firestore.rules.test.js
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator used by the rules tests needs Java 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      # Don't deploy rules that fail their own tests.
      - run: npm run test:rules

      # Use the same project the web app talks to.
      - id: project
        run: |
          id=$(grep -oP "projectId:\s*'\K[^']+" src/firebase.config.js)
          if [ -z "$id" ]; then echo "Could not read projectId from src/firebase.config.js" >&2; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: npx firebase deploy --only firestore:rules --project "${{ steps.project.outputs.id }}" --non-interactive
