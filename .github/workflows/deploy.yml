name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Assets load from /<repo-name>/, whatever the repo is called.
          VITE_BASE: /${{ github.event.repository.name }}/
          # The assistant (src/assistant/). On by default; to switch it off, add a repository
          # variable VITE_ENABLE_ASSISTANT = false (Settings > Secrets and variables > Actions > Variables)
          # and re-run this workflow. The Worker URL is public; the model key lives only in the Worker.
          VITE_ENABLE_ASSISTANT: ${{ vars.VITE_ENABLE_ASSISTANT || 'true' }}
          VITE_CHAT_ENDPOINT: https://many-hands-chat.jmielk92.workers.dev
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
