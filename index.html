<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Applies the saved appearance before anything paints. Mirrors src/lib/theme.js.
      (function () {
        var choice = null;
        try { choice = localStorage.getItem('mh-theme'); } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#ffffff');
      })();
    </script>
    <meta name="description" content="Many Hands helps a community see which tasks still need someone." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Many Hands</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
